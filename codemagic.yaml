workflows:
  ios-sideload-ipa:
    name: Build iOS IPA (Sideload / TrollStore)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install --legacy-peer-deps
      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update
      - name: Build and Package IPA
        script: |
          WORKSPACE="ios/ZenFlowTracker.xcworkspace"
          SCHEME="ZenFlowTracker"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            COMPILER_INDEX_STORE_ENABLE=NO

          mkdir -p Payload
          APP_DIR=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          cp -r "$APP_DIR" Payload/
          zip -qr ZenFlowTracker.ipa Payload

          mkdir -p build/ios/ipa
          mv ZenFlowTracker.ipa build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: Build iOS App for TestFlight / App Store (Yêu cầu Apple Dev Account)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install --legacy-peer-deps
      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build IPA for App Store / TestFlight
        script: |
          xcode-project build-ipa \
            --workspace "ios/ZenFlowTracker.xcworkspace" \
            --scheme "ZenFlowTracker"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
